name: Build and Release Firmware

# A published GitHub release (tag MAJOR.MINOR.PATCH, a leading "v" is allowed) is built by
# build.yml with that version -- the same build and host tests every push runs -- and the four
# images are attached to it. A failed build attaches nothing.

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event.release.tag_name }}

  attach:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: out

      - name: Attach the images to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l out
          [ "$(ls out | wc -l)" -eq 4 ]
          gh release upload "${{ github.event.release.tag_name }}" out/* --clobber \
            --repo "${{ github.repository }}"
